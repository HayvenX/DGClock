<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://static.thenounproject.com/png/1495285-200.png">
    
    <link rel="stylesheet" href="main.css">
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
    
    <title>DG Clock</title>
</head>
<body>
    <div id="video-container">
        <div id="youtube-player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></div>
    </div>
    
    <div id="app-overlay">
        
        <div id="top-bar">
            <button id="menu-btn">☰</button>
            <div class="info-group">
                <div id="city-info">City: <span id="city-name">—</span></div>
                <div id="weather-info">Weather: <span id="weather-icon"></span> <span id="temperature">—</span></div>
                <div id="timezone-info">Timezone: <span id="timezone">—</span></div>
            </div>
        </div>
            
        <div id="sidebar">
            <div id="sidebar-header">
                <h2>Locations</h2>
                <button id="close-btn">×</button>
            </div>
            
            <div class="search-container">
                <input type="text" id="city-search" placeholder="Search city... 🔍" autocomplete="off">
                <div id="search-results" class="search-results hidden"></div>
            </div>
            
            <div id="accordion-container"></div>

            <div id="sidebar-settings">
                <div class="volume-container">
                    <button id="mute-btn" class="icon-btn" title="Toggle Sound">🔇</button>
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                </div>
                
                <div class="setting-row">
                    <span>Temperature</span>
                    <div class="toggle-group" id="temp-toggle">
                        <button class="toggle-btn active" data-val="c">°C</button>
                        <button class="toggle-btn" data-val="f">°F</button>
                    </div>
                </div>
                
                <div class="setting-row">
                    <span>Time Format</span>
                    <div class="toggle-group" id="time-toggle">
                        <button class="toggle-btn active" data-val="24">24h</button>
                        <button class="toggle-btn" data-val="12">12h</button>
                    </div>
                </div>
                <button id="hide-ui-btn">Hide Interface 👁️</button>
            </div>
        </div>
        
        <div id="sidebar-overlay"></div>
        
        <div id="clock-container">
            <div id="clock">00:00:00</div>
        </div>
        <div id="data-container">
            <div id="day">—</div>
            <div id="month">—</div>
            <div id="num">—</div>
            <div id="year">—</div>
        </div>
        
    </div>
    
    <div id="hide-hint">Click anywhere to restore interface 👁️</div>
    
</body>
</html>
